name: CI

# Umbrella CI for the dependency-modernization effort.
# Runs on every pull request and on pushes to the `modernization` branch
# (where all modernization work lands before merging to main).
on:
  pull_request:
  push:
    branches:
      - modernization

# Build-time env placeholders.
#
# `next build` statically evaluates some NEXT_PUBLIC_* values and Clerk's
# publishable key is parsed/decoded at build time, so missing or malformed
# values would fail the build. These are intentionally DUMMY values -- no real
# secrets are needed, because this pipeline is the acceptance gate for upgrade
# PRs and must stay green on placeholders alone. The Clerk publishable key below
# is a syntactically valid test key (pk_test_ + base64 of "example.clerk.
# accounts.dev$"); it authenticates nothing. The build does NOT run
# `convex deploy`, so a real Convex deployment is not required either.
env:
  ENV: production
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
  CLERK_SECRET_KEY: sk_test_dummydummydummydummydummydummydummydummy
  CLERK_JWT_ISSUER_DOMAIN: https://example.clerk.accounts.dev
  NEXT_CLERK_FRONTEND_API_URL: https://example.clerk.accounts.dev
  NEXT_PUBLIC_WAITLIST_ENABLED: "false"
  NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
  CONVEX_DEPLOYMENT: dev:example-123
  FAL_KEY: dummy
  GOOGLE_API_KEY: dummy
  USE_GEMINI_FOR_IMAGES: "true"

jobs:
  ci:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 10 generated pnpm-lock.yaml; its packageExtensionsChecksum
          # differs from pnpm 9, so --frozen-lockfile requires pnpm 10 here.
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
